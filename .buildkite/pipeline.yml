steps:
  - label: ":construction_worker: Build"
    command: echo "Build the rocket"
    key: build

  - label: ":white_check_mark: Test"
    command: |
      echo "🧪 Installing uv..."
      curl -LsSf https://astral.sh/uv/install.sh | sh
      source $HOME/.local/bin/env
      echo "🧪 Running rocket tests..."
      ./run_tests.sh
    artifact_paths: "test-results.xml"
    key: test
    depends_on: build
    env:
      BUILDKITE_ANALYTICS_TOKEN: hJ3rtEfsAfzfE1Xp9nn4iJNF

  - label: ":rocket: Deploy"
    command: |
      echo "Launch the rocket"
      cat .buildkite/annotation.md | buildkite-agent annotate --style "success"
    key: deploy
    depends_on: test
